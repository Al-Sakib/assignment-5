<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | DevBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <!-- Top bar (same as home) -->
    <header class="topbar">
      <a class="logo" href="index.html" aria-label="DevBoard home">
        <span class="logo-mark"><span></span></span>
        <span class="logo-text">Dev<b>Board</b></span>
      </a>
      <div class="topbar-right">
        <div class="done-pill" title="Tasks completed">
          <span class="check-box">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </span>
          <span>23</span>
        </div>
        <button id="theme-btn" class="theme-btn" type="button" aria-label="Change theme color" title="Change theme color"></button>
      </div>
    </header>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
